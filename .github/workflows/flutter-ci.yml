# Last Modified: 2026-08-21 13:49 KST (작성자: ChatGPT)
# Insert Location: signalflow-frontend/.github/workflows/flutter-ci.yml 전체 교체

name: Flutter App CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # [Added by ChatGPT | 2026-08-21 13:49 KST]
      # PR 단계에서는 APK를 만들지 않고,
      # main 브랜치에 Merge된 뒤 push 이벤트에서만 APK 생성
      - name: Build debug APK
        if: github.event_name == 'push'
        run: flutter build apk --debug

      # [Added by ChatGPT | 2026-08-21 13:49 KST]
      # 생성된 APK를 GitHub Actions Artifacts에 업로드
      - name: Upload debug APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: signalflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
